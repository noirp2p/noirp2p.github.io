<body>
<div class="app" id="app"></div>
<div class="nav"><div class="in" id="nav"></div></div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<div id="tour"><div id="tcatch"></div><div id="spot"></div><div id="tip"><p id="ttext"></p><div class="tr2"><small id="tnum"></small><button id="tnext">Далее</button></div></div><div id="intro" style="display:none"></div><div id="hint">Нажмите «Далее», чтобы продолжить</div></div>
<div id="splash"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="none" stroke="#CCBAAA" stroke-width="2"/><text x="75" y="92" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#F9F5E9">N</text><circle cx="118" cy="38" r="6" fill="#F2C6CC" style="stroke-dasharray:none;animation:none"/></svg><h1>Noir P2P</h1><p>ваш P2P под контролем</p></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand();
  try { if (['android','ios'].includes(tg.platform) && tg.requestFullscreen) tg.requestFullscreen(); } catch(e){}
  try { tg.setHeaderColor('#F9F5E9'); tg.setBackgroundColor('#F9F5E9'); tg.setBottomBarColor && tg.setBottomBarColor('#353535'); } catch(e){} }
const U = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {first_name:'Стас', username:'stas_p2p'};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');
const hap = (t='light') => { try { tg.HapticFeedback.impactOccurred(t) } catch(e){} };
const store = { get(k,d){ try{ const v=localStorage.getItem('noir_'+k); return v===null?d:JSON.parse(v) }catch(e){ return d } },
                set(k,v){ try{ localStorage.setItem('noir_'+k, JSON.stringify(v)) }catch(e){} } };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),t.length>40?3200:1800) }

// ---------- связь с ботом (шаг 5: Binance) ----------
const API = (()=>{ try{ const u=new URLSearchParams(location.search).get('api')||''; return /^(https:\/\/[a-z0-9.-]+|http:\/\/127\.0\.0\.1:\d+)$/i.test(u)?u:'' }catch(e){ return '' } })();
let BN = {connected:false, loaded:false};
const STAT = {}, PEND = {};
async function api(path, body){
  if(!API) throw new Error('Откройте приложение заново кнопкой «Открыть» в чате бота');
  let r, j={};
  try{ r = await fetch(API+path, {method:body?'POST':'GET', headers:Object.assign({'X-Init-Data':(tg&&tg.initData)||''}, /\.ngrok(-free)?\.(app|dev)$/.test(new URL(API).hostname)?{'ngrok-skip-browser-warning':'1'}:{}, body?{'Content-Type':'application/json'}:{}), body:body?JSON.stringify(body):undefined}) }
  catch(e){ throw new Error('Бот сейчас не на связи. Попробуйте позже или откройте приложение заново.') }
  try{ j = await r.json() }catch(e){}
  if(!r.ok || !j.ok) throw new Error(j.error || 'Бот сейчас не на связи. Попробуйте позже.');
  return j }
const DAYMS=864e5, dayStart = d => { const x=new Date(d); x.setHours(0,0,0,0); return +x };
function perRange(k){ const t=dayStart(Date.now());
  if(k==='Сегодня') return [t, t+DAYMS]; if(k==='Неделя') return [t-6*DAYMS, t+DAYMS]; if(k==='Месяц') return [t-29*DAYMS, t+DAYMS];
  const [a,b]=k.slice(1).split('_').map(Number); return [a, b+DAYMS] }
const st = k => STAT[k] && STAT[k].d;
function ensure(k){ if(!BN.connected || PEND[k] || (STAT[k] && Date.now()-STAT[k].at<60000)) return;
  PEND[k]=1; const [a,b]=perRange(k);
  api(`/api/stats?from=${a}&to=${b}&tz=${new Date().getTimezoneOffset()}`).then(j=>{ STAT[k]={d:j,at:Date.now()};
      Object.assign(BN,{last_sync:j.last_sync,sync_error:j.sync_error,start_usdt:j.start_usdt,start_price:j.start_price,start_uah:j.start_uah,track_from:j.track_from,profit_from:j.profit_from}); if(j.connected===false){ BN.connected=false } })

function calc(e){ const x=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.').replace(/[^0-9.+\-*/]/g,'').replace(/[+\-*/.]+$/,'');
  if(!x) return 0; try{ const v=Function('"use strict";return ('+x+')')(); return isFinite(v)?Math.max(0,Math.round(v*100)/100):0 }catch(_){ return 0 } }
const shAmt = () => /[+−×÷]/.test(sh.expr.slice(1)) ? sh.expr.replace(/,/g,',') : (sh.expr==='0'?'0':sh.expr);

function key(x){ hap(); let e=sh.expr;
  if(x==='⌫') e = e.length>1?e.slice(0,-1):'0';
  else if('+−×÷'.includes(x)) e = /[+−×÷,]$/.test(e) ? e.slice(0,-1)+x : e+x;
  else if(x===','){ const last=e.split(/[+−×÷]/).pop(); if(!last.includes(',')) e+= (/[+−×÷]$/.test(e)?'0,':',') }
  else e = (e==='0'?'':e)+x;
  if(e.length>20) return; sh.expr=e; drawSheet() }

// ---------- мини-обучение ----------
const TOURS={
 home:{t:'Home',p:'Главный экран: всё самое важное о вашем P2P за день',s:[['hello','Здесь ваше имя и аватарка из Telegram'],['today','Прибыль за сегодня, оборот и количество ордеров'],['week','Прибыль за неделю и ваш средний спред'],['check','Проверка чека: пришлите квитанцию, бот найдёт код и поможет проверить'],['chart','Подключите Binance — и бот сам начнёт считать прибыль, а здесь появится график'],['nav','Меню: отсюда переходите во все разделы']]},
 p2p:{t:'P2P',p:'Ваши ордера Binance: прибыль, оборот и спред',s:[['chips','Выберите период: сегодня, неделя, месяц или свой в календаре'],['profit','Чистая прибыль за период, оборот, ордера и спред'],['rates','Средний курс покупки и продажи USDT'],['bars','Прибыль по дням — лучший день подсвечен розовым'],['orders','Все ордера из Binance с фильтром покупка / продажа'],['check','Проверить чек по любому ордеру']]},
 fin:{t:'Финансы',p:'Личные доходы и расходы в одном месте',s:[['total','Итог за месяц: сколько пришло и сколько ушло'],['list','Все записи по дням. Прибыль из P2P попадает сюда сама'],['fab','Нажмите «＋», чтобы добавить расход или доход']]},
 rat:{t:'Рейтинг',p:'Годовой рейтинг пользователей Noir P2P',s:[['season','Сезон длится год и обнуляется 1 января'],['podium','Тройка лидеров сезона — места пока свободны'],['mine','Ваше место и сколько очков до следующего']]},
 pro:{t:'Профиль',p:'Ваш аккаунт, Binance и настройки',s:[['pcard','Ваше место в рейтинге и серия заходов'],['bin','Подключение Binance — ключ только для чтения'],['set','Настройки: рейтинг, уведомления, стартовый остаток'],['help','Обучение, ИИ-помощник и платная консультация'],['del','Здесь можно удалить все свои данные']]}};
let T=null;
function startTour(k){ if(store.get('tour_'+k)) return; const d=TOURS[k]; T={k,i:-1,d}; $('#tour').classList.add('on'); $('#spot').style.display='none'; $('#tip').style.display='none';
  const ib=$('#intro'); ib.style.display='flex'; ib.innerHTML=`<div class="ic">${svg(k,64)}</div><h2>${d.t}</h2><div class="ln"></div><p>${d.p}</p><button onclick="tourNext()">Начать</button>`; }
function tourNext(){ hap(); $('#intro').style.display='none'; T.i++; const st=T.d.s;
  if(T.i>=st.length){ $('#tour').classList.remove('on'); store.set('tour_'+T.k,true); T=null; render(true); return }
  const [sel,txt]=st[T.i]; const el = sel==='nav'?$('.nav .in'):sel==='fab'?$('.fb'):document.querySelector(`[data-t="${sel}"]`);
  if(!el){ return tourNext() }
  const fixed = sel==='nav'||sel==='fab'||sel==='mine'; if(!fixed) el.scrollIntoView({block:'center'});
  setTimeout(()=>{ const r=el.getBoundingClientRect(), pad=6, sp=$('#spot'); sp.style.display='block';
    Object.assign(sp.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px',borderRadius:sel==='fab'?'50%':'18px'});
    const tip=$('#tip'); tip.style.display='block'; $('#ttext').textContent=txt; $('#tnum').textContent=(T.i+1)+' / '+st.length;
    $('#tnext').textContent = T.i===st.length-1?'Готово':'Далее';
    const below = r.bottom+170 < innerHeight; tip.style.top = (below ? r.bottom+16 : Math.max(16, r.top-16-tip.offsetHeight))+'px' }, fixed?0:260) }
$('#tnext').onclick=tourNext;
$('#tcatch').onclick=()=>{ const t=$('#tip'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); $('#hint').classList.add('on'); clearTimeout(T&&T.h); setTimeout(()=>$('#hint').classList.remove('on'),1600); try{tg.HapticFeedback.notificationOccurred('warning')}catch(e){} };
function resetTours(){ Object.keys(TOURS).forEach(k=>{try{localStorage.removeItem('noir_tour_'+k)}catch(e){}}); go('home',true) }
function countUp(){ document.querySelectorAll('.cnt').forEach(e=>{ const v=+e.dataset.v, t0=performance.now();
  const f=t=>{ const k=Math.min(1,(t-t0)/900), e2=1-Math.pow(1-k,3); e.textContent=fmt(v*e2); if(k<1) requestAnimationFrame(f) }; requestAnimationFrame(f) }) }

// ---------- навигация ----------
let tab = 'home';
function render(quiet){
  $('#app').innerHTML = `<div class="view${quiet===true?' q':''}">${({home:vHome,p2p:vP2P,fin:vFin,rat:vRat,pro:vPro})[tab]()}</div>`;
  [...$('.view').children].forEach((c,i)=>c.style.animationDelay=Math.min(i,10)*60+'ms'); if(quiet!==true) countUp();
  $('#nav').innerHTML = TABS.map(([k,l])=>`<button class="ni ${k===tab?'on':''}" onclick="go('${k}')">${svg(k)}<span>${l}</span></button>`).join('');
  document.querySelectorAll('.fabs').forEach(e=>e.remove());
  if (tab==='fin') document.body.insertAdjacentHTML('beforeend','<div class="fabs"><button class="fb" onclick="openSheet()">＋</button></div>');
  if (tab==='p2p' && custom){ const c=$('.chips'); if(c) c.scrollLeft=c.scrollWidth }
}
function go(k,force){ if(k===tab&&!force) return; tab=k; hap(); window.scrollTo(0,0); render(); setTimeout(()=>startTour(k),450) }
$('#dim').onclick = closeSheet;
function loadMe(){ if(!API){ BN.offline=true; return }
  api('/api/me').then(j=>{ Object.assign(BN,j,{loaded:true,offline:false}) }).catch(()=>{ BN.offline=true })
    .finally(()=>{ if(!$('#splash')&&!T) render(true) }) }
function retryMe(){ hap(); BN.offline=false; render(true); loadMe() }
loadMe();
setTimeout(()=>{ $('#splash').classList.add('off'); render(); setTimeout(()=>startTour('home'),600); setTimeout(()=>$('#splash').remove(),600) }, 1700);
</script>
</body>
</html>
