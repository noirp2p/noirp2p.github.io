  if(!cats.includes(sh.cat)){ if(sh.id&&sh.cat&&(CAT[sh.cat]||UCATS.some(c=>c.id===sh.cat))&&sh.mode===sh.m0) cats.splice(1,0,sh.cat); else sh.cat='none' }

    <button class="rb2" onclick="sh.menu=!sh.menu;drawSheet()">⋮</button>
    ${sh.menu?`<div class="menu"><button onclick="repeatTx()">🔁 Повтор</button>${sh.id?`<button style="color:var(--T)" onclick="delTx()">🗑 Удалить</button>`:''}<div class="mh">Вид</div>

  </div>
